<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token or '' }}">
  <title>{% block title %}WinSW Recovery MVP{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="lab-banner">LAB_HTTP · production_ready=false · 仅限受控实验局域网</div>
  <header class="topbar">
    <a class="brand" href="/">WinSW Recovery</a>
    {% if session_admin %}
    <nav>
      <a href="/">Dashboard</a>
      <a href="/groups">Recovery Groups</a>
      <form action="/logout" method="post" class="inline-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="link-button" type="submit">退出</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    <div id="flash" class="flash" hidden></div>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
